<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Vorlage für das Teilen-Vorschaubild</title>
<!--
  Quelle für assets/og-bild.png (1200x630) - das Bild, das WhatsApp,
  Signal, Discord und Co. anzeigen, wenn jemand einen SchülerMatch-Link
  teilt.

  Warum als HTML und nicht als Grafikdatei: So kommen Schrift und Farben
  aus derselben Quelle wie die Seite selbst. Ein nachgebautes Bild driftet
  beim nächsten Design-Wechsel auseinander.

  Neu erzeugen: siehe PROJEKT-STATUS.md, Eintrag vom 26.8.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; }

  .karte {
    width: 1200px; height: 630px;
    /* Bewusst der TIEFE Verlauf, nicht der helle Marken-Verlauf: Weisse
       Schrift auf #00c896 kommt nur auf 2,2:1. Auf #00795c sind es 5,4:1.
       Dieselbe Lehre wie bei den Knoepfen am 26.8. */
    background: linear-gradient(120deg, #00795c 0%, #2b2f8f 100%);
    padding: 74px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }

  /* Ruhige Kreise als Tiefe - kein Muster, das vom Text ablenkt. */
  .kreis {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,0.055);
  }
  .kreis-1 { width: 560px; height: 560px; right: -150px; top: -190px; }
  .kreis-2 { width: 320px; height: 320px; right: 130px; bottom: -140px; }

  .kopf { display: flex; align-items: center; gap: 18px; position: relative; }
  .kopf img { height: 54px; width: auto; display: block; }

  .mitte { position: relative; }
  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-weight: 700; font-size: 82px; line-height: 1.04;
    color: #fff; letter-spacing: -0.015em;
    max-width: 900px;
  }
  /* Helles Mint statt der Markenfarbe #00c896: Auf diesem Verlauf kommt
     das Marken-Grün nur auf 2,87:1 und liegt damit sogar unter den 3:1,
     die für große Schrift gelten. Dieser Ton hält 4,3:1. Gleiche
     Farbfamilie, nur heller - dieselbe Logik wie bei logo-light.png. */
  h1 em { font-style: normal; color: #6bf0cb; }

  p.unter {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 30px; font-weight: 400; line-height: 1.4;
    color: rgba(255,255,255,0.88); margin-top: 22px; max-width: 820px;
  }

  .fuss {
    display: flex; align-items: center; gap: 14px;
    position: relative;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 23px; color: rgba(255,255,255,0.9);
  }
  .marke {
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 100px; padding: 9px 20px;
    font-size: 21px; letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="karte">
  <div class="kreis kreis-1"></div>
  <div class="kreis kreis-2"></div>

  <div class="kopf">
    <img src="logo-light.png" alt="SchülerMatch">
  </div>

  <div class="mitte">
    <h1>Dein erster Job.<br><em>Ohne Umwege.</em></h1>
    <p class="unter">Minijobs für Schüler ab 13 – passend zu deinem Alter, deiner Zeit und deinem Ort.</p>
  </div>

  <div class="fuss">
    <span class="marke">Kostenlos</span>
    <span class="marke">Jugendschutzgeprüft</span>
    <span style="margin-left:auto;">schuelermatch.de</span>
  </div>
</div>
</body>
</html>
