<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – SchülerMatch</title>
<meta name="description" content="Melde dich bei SchülerMatch an – der kostenlosen Plattform für Schülerjobs in deiner Nähe.">
<meta property="og:title" content="Login – SchülerMatch">
<meta property="og:description" content="Melde dich bei SchülerMatch an – der kostenlosen Plattform für Schülerjobs in deiner Nähe.">
<meta property="og:type" content="website">
<meta property="og:locale" content="de_DE">
<meta property="og:url" content="https://schuelermatch.de/login.html">
<meta property="og:image" content="https://schuelermatch.de/assets/og-bild.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="SchülerMatch – Dein erster Job. Ohne Umwege.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/monitoring.js"></script>
<script src="js/gate.js"></script>
<script defer src="js/tastatur.js"></script>
<link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="auth-page">

<nav>
  <a href="index.html" class="logo"><img src="assets/logo.png" alt="SchülerMatch" class="logo-img"></a>
  <div class="nav-links"></div>
  <a href="register.html" class="btn btn-outline">Registrieren</a>
</nav>
<script src="js/nav.js"></script>

<main class="auth-main">
  <div class="auth-box">
    <h1>Willkommen zurück</h1>
    <p class="sub">Logge dich in deinen Account ein.</p>

    <div class="role-tabs">
      <button type="button" class="role-tab active" aria-pressed="true" onclick="setRole('schueler', this)">Ich bin Schüler</button>
      <button type="button" class="role-tab" aria-pressed="false" onclick="setRole('firma', this)">Ich bin Arbeitgeber</button>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">E-Mail</label>
        <input type="email" id="email" placeholder="deine@email.de" required>
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-green btn-full" style="margin-top:8px;">Einloggen</button>
    </form>

    <p class="auth-switch"><a href="forgot-password.html">Passwort vergessen?</a></p>
    <p class="auth-switch">Noch kein Account? <a href="register.html">Jetzt registrieren</a></p>
  </div>
</main>

<p style="text-align:center; padding-bottom:24px; font-size:0.8rem; color:var(--ink-soft);">
  <a href="impressum.html" style="color:inherit;">Impressum</a> · <a href="datenschutz.html" style="color:inherit;">Datenschutz</a>
</p>

<script type="module" src="js/auth.js"></script>
<script>
  function setRole(role, el) {
    document.querySelectorAll('.role-tab').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-pressed', 'false');
    });
    el.classList.add('active');
    el.setAttribute('aria-pressed', 'true');
    document.getElementById('login-form').dataset.role = role;
  }
</script>
</body>
</html>
